spring.application.name=dreamCar

# ===================================================================
# Configurações do MySQL (Comentadas com #)
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/dreamcar
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=validate

# ===================================================================
# Configurações do H2 Database (Ativas)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:dreamcardb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o Console WEB do H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Cria/Atualiza a estrutura das tabelas automaticamente no H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Exibe as queries SQL executadas no console do Terminal
spring.jpa.show-sql=true