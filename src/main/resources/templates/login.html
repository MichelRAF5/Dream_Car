<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/login-style.css">
    <title>Login Dream Car</title>
</head>

<body>
    <header>
        <h1>Concessionária Dream Car</h1>
    </header>

    <main>
        <form id="loginForm">
            <h3>Login</h3>

            <section class="section-email">
            <label for="email">Email:<br></label>
            <input type="text" id="email" name="email" required placeholder="seuemail@email.com">
            </section>
            
            <section class="section-senha">
            <label for="senha">Senha:<br></label>
            <input type="password" id="senha" name="senha" required placeholder="********">
            </section>
            
            <button type="submit" id="botao-login">Login</button>

            <p id="mensagem"></p>
            
            <section id="section-cadastro">
                <p>Não possui uma conta?</p>
                <a href="./cadastro.html">Cadastre-se</a>
            </section>
        </form>
    </main>

    <script src="../static/js/login.js"></script>
    
</body>

</html>
